databases:
  - name: cms-postgres
    databaseName: cms_db
    user: cms_user
    plan: free

services:
  - type: web
    name: complaint-management-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cms-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true