<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Complaint | Complaint Management System</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">CMS</div>
        <nav class="nav-menu">
          <a href="/dashboard.html">Dashboard</a>
          <a href="/submit-complaint.html" class="active">Submit Complaint</a>
          <a href="/my-complaints.html">My Complaints</a>
          <a href="/track-complaint.html">Track Complaint</a>
          <a href="/notifications.html">Notifications</a>
          <button id="logoutBtn" class="link-btn">Logout</button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h2>Submit Complaint</h2>
          <div id="userLabel" class="user-label"></div>
        </header>

        <section class="panel form-panel">
          <form id="complaintForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="subject">Subject</label>
                <input id="subject" name="subject" type="text" required />
              </div>

              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required></select>
              </div>

              <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" required></select>
              </div>

              <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="department" required></select>
              </div>
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" name="description" rows="6" required></textarea>
            </div>

            <button type="submit" class="primary-btn">Submit Complaint</button>
          </form>

          <div id="complaintMessage" class="message-box hidden"></div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/user.js"></script>
  </body>
</html>
