<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Complaint Management System</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">CMS</div>
        <nav class="nav-menu">
          <a href="/dashboard.html" class="active">Dashboard</a>
          <a href="/submit-complaint.html">Submit Complaint</a>
          <a href="/my-complaints.html">My Complaints</a>
          <a href="/track-complaint.html">Track Complaint</a>
          <a href="/notifications.html">Notifications</a>
          <button id="logoutBtn" class="link-btn">Logout</button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h2>Student Dashboard</h2>
          <div id="userLabel" class="user-label"></div>
        </header>

        <section class="stats-grid">
          <div class="stat-card">
            <span>Total Complaints</span>
            <strong id="totalComplaints">0</strong>
          </div>
          <div class="stat-card warning">
            <span>Pending</span>
            <strong id="pendingComplaints">0</strong>
          </div>
          <div class="stat-card info">
            <span>Assigned</span>
            <strong id="assignedComplaints">0</strong>
          </div>
          <div class="stat-card primary">
            <span>In Progress</span>
            <strong id="inProgressComplaints">0</strong>
          </div>
          <div class="stat-card success">
            <span>Resolved</span>
            <strong id="resolvedComplaints">0</strong>
          </div>
          <div class="stat-card dark">
            <span>Closed</span>
            <strong id="closedComplaints">0</strong>
          </div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h3>Recent Complaints</h3>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Subject</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="userComplaintTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/user.js"></script>
  </body>
</html>
